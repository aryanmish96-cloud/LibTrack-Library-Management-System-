# ===== Server =====
server.port=8000

# ===== SQLite Datasource =====
spring.datasource.url=jdbc:sqlite:../libtrack.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# ===== JPA / Hibernate =====
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== JWT =====
jwt.secret=CHANGE_ME_IN_PRODUCTION_USE_A_LONG_RANDOM_SECRET_KEY_AT_LEAST_256_BITS
jwt.expiration-ms=86400000

# ===== Business Rules =====
loan.period-days=14
loan.fine-per-day=0.50

# ===== Jackson — use snake_case to match Python FastAPI convention =====
spring.jackson.property-naming-strategy=SNAKE_CASE

# ===== Logging =====
logging.level.com.libtrack=INFO
logging.level.org.springframework.security=WARN
