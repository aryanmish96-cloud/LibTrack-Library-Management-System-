version: "3.9"

services:
  api:
    build: .
    container_name: libtrack-api
    ports:
      - "8000:8000"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:sqlite:/app/data/libtrack.db
      - JWT_SECRET=CHANGE_ME_IN_PRODUCTION
      - JWT_EXPIRATION_MS=86400000
    volumes:
      # Persist the SQLite database file between container restarts
      - libtrack-db:/app/data
    restart: unless-stopped

volumes:
  libtrack-db:
