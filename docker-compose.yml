version: "3.9"

services:
  api:
    build: .
    container_name: libtrack-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./libtrack.db
      - SECRET_KEY=CHANGE_ME_IN_PRODUCTION
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
    volumes:
      # Persist the SQLite database file between container restarts
      - libtrack-db:/app/libtrack.db
    restart: unless-stopped

volumes:
  libtrack-db:
